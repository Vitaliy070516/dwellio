name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pint → PHPStan → Pest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      pgsql:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sail -d testing"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # Перелік явний і збігається з .gitlab-ci.yml: sockets потрібен php-amqplib (RabbitMQ).
          extensions: pdo_pgsql, redis, mbstring, intl, sockets
          # setup-php за замовчуванням дає -1 (без ліміту) і ховає ріст пам'яті тестів;
          # 512M — як у .gitlab-ci.yml, щоб обидва CI падали однаково.
          ini-values: memory_limit=512M
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: cp .env.example .env && php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # Закомічена специфікація (її віддає /docs/api.json) = згенерована з коду цього коміту.
      # Змінив контролер/FormRequest/Resource і не перегенерував — червоний CI з diff-ом у лозі.
      - name: OpenAPI is up to date
        # Scramble бере типи атрибутів моделей зі схеми БД: без міграцій специфікація вийде іншою.
        run: |
          php artisan migrate --force --no-interaction
          php artisan scramble:export
          git diff --exit-code -- docs/openapi.json || { echo "::error::docs/openapi.json is stale: run 'make openapi' and commit"; exit 1; }

      - name: Pest
        run: vendor/bin/pest

  # Логіка станів фронту (деградація пошуку, обрив WebSocket, помилки API): Vitest + jsdom, без браузера.
  # Окремий job: паралельно з PHP і без Postgres.
  js:
    name: JS tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm test

  terraform:
    name: Terraform fmt → validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: terraform/envs/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.x'

      - name: fmt
        run: terraform fmt -check -recursive -diff ../..

      # -backend=false: без AWS-акаунта й облікових даних (state і провайдер не потрібні для validate).
      - name: init
        run: terraform init -backend=false -input=false

      - name: validate
        run: terraform validate
