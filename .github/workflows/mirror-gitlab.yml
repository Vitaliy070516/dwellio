# GitLab Free не має pull-mirroring, тому штовхаємо з GitHub самі.
# Потрібні: secret GITLAB_TOKEN (Project Access Token, role Maintainer, scope write_repository),
# variable GITLAB_REPO_URL (напр. gitlab.com/<user>/dwellio.git — без схеми й без токена).
name: Mirror to GitLab

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

concurrency:
  group: mirror-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO_URL: ${{ vars.GITLAB_REPO_URL }}
        run: |
          set -euo pipefail
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO_URL}"
          git push --force gitlab "refs/remotes/origin/main:refs/heads/main"
          git push --force gitlab --tags
