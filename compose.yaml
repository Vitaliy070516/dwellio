# Dev-оточення через Laravel Sail.
# Базові сервіси: laravel.test, reverb, pgsql (pgvector), redis, rabbitmq.
# Важкі/опційні сервіси — у profiles: `ollama`, `obs`, `workers`, `demo` (див. Makefile).

# Статична IP Caddy у мережі `demo`: Laravel довіряє X-Forwarded-* ЛИШЕ з цієї адреси (config/trustedproxy.php).
x-demo-proxy-ip: &demo-proxy-ip '172.29.212.10'

# Спільне оточення PHP-контейнерів. APP_ENV/APP_DEBUG/DEMO_MODE/APP_CONFIG_CACHE тут, а не лише в .env:
# `make demo-up` перекриває їх змінними shell (вони пріоритетніші за .env) без правки файлу,
# а звичайний `make up` повертає значення з .env. Демо-кеш конфігу — окремим файлом, щоб
# локальна розробка після демо не підхопила кешовані demo-налаштування.
x-app-env: &app-env
    WWWUSER: '${WWWUSER}'
    LARAVEL_SAIL: 1
    APP_ENV: '${APP_ENV:-local}'
    APP_DEBUG: '${APP_DEBUG:-true}'
    DEMO_MODE: '${DEMO_MODE:-false}'
    APP_CONFIG_CACHE: '${APP_CONFIG_CACHE:-bootstrap/cache/config.php}'
    TRUSTED_PROXIES: *demo-proxy-ip

services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            <<: *app-env
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
            - demo
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
    # ---- Reverb (WebSockets): окремий процес = окремий контейнер (на тижні 4 — окремий Deployment) ----
    # Scaling через Redis pub/sub увімкнено навіть для одного інстансу: подія, опублікована
    # воркером через HTTP API в будь-який інстанс, доходить до клієнтів усіх інстансів.
    reverb:
        image: 'sail-8.4/app'
        command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        ports:
            - '${FORWARD_REVERB_PORT:-8080}:8080'
        environment:
            <<: *app-env
            REVERB_SCALING_ENABLED: 'true'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
            - demo
        depends_on:
            redis:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/up']
            interval: 10s
            retries: 3
            timeout: 5s
        mem_limit: 256m

    # ---- profile: workers (воркери черг; без профілю — `make worker` у laravel.test) ----
    # stop_grace_period > найдовшого $timeout Job: SIGTERM дає воркеру дочекати поточну задачу,
    # інакше деплой обірве генерацію посеред стріму, і RabbitMQ доставить її повторно (= повторна оплата токенів).
    worker-embeddings:
        profiles: ['workers']
        image: 'sail-8.4/app'
        command: ['php', 'artisan', 'queue:work', 'rabbitmq', '--queue=embeddings', '--timeout=120', '--max-jobs=500', '--max-time=3600']
        environment:
            <<: *app-env
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        stop_grace_period: 150s
        mem_limit: 256m
    worker-generation:
        profiles: ['workers']
        image: 'sail-8.4/app'
        command: ['php', 'artisan', 'queue:work', 'rabbitmq', '--queue=generation', '--timeout=270', '--max-jobs=200', '--max-time=3600']
        environment:
            <<: *app-env
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            reverb:
                condition: service_healthy
        stop_grace_period: 300s
        mem_limit: 256m

    pgsql:
        image: 'pgvector/pgvector:pg18'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './docker/postgres/10-init-extensions.sql:/docker-entrypoint-initdb.d/10-init-extensions.sql'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE}', '-U', '${DB_USERNAME}']
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 3
            timeout: 5s
    rabbitmq:
        image: 'rabbitmq:4-management-alpine'
        hostname: rabbitmq
        ports:
            - '${FORWARD_RABBITMQ_PORT:-5672}:5672'
            - '${FORWARD_RABBITMQ_DASHBOARD_PORT:-15672}:15672'
        environment:
            RABBITMQ_DEFAULT_USER: '${RABBITMQ_USER:-dwellio}'
            RABBITMQ_DEFAULT_PASS: '${RABBITMQ_PASSWORD:-secret}'
            RABBITMQ_DEFAULT_VHOST: '${RABBITMQ_VHOST:-/}'
        volumes:
            - 'sail-rabbitmq:/var/lib/rabbitmq'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
            interval: 10s
            retries: 5
            timeout: 10s

    # ---- profile: ollama (локальна LLM + embeddings, $0) ----
    ollama:
        profiles: ['ollama']
        image: 'ollama/ollama:latest'
        environment:
            # За замовчуванням Ollama вивантажує модель після 5 хв простою, і наступний гість демо
            # чекає холодний старт (~25 с ембединги + розбір запиту). 30m — компроміс з RAM ноутбука.
            OLLAMA_KEEP_ALIVE: '${OLLAMA_KEEP_ALIVE:-30m}'
        ports:
            - '${FORWARD_OLLAMA_PORT:-11434}:11434'
        volumes:
            - 'sail-ollama:/root/.ollama'
        networks:
            - sail
        mem_limit: 6g

    # ---- profile: demo (публічне демо через Cloudflare Tunnel, День 12; див. make demo-up) ----
    # Quick Tunnel: без акаунта й домену, адреса *.trycloudflare.com нова при кожному старті (make demo-url).
    # Обмеження Quick Tunnel: до 200 одночасних запитів (далі 429), без SLA — лише для показу, не для проду.
    demo-proxy:
        profiles: ['demo']
        image: 'caddy:2-alpine'
        volumes:
            - './docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro'
        networks:
            demo:
                ipv4_address: *demo-proxy-ip
        depends_on:
            - laravel.test
            - reverb
        mem_limit: 64m
    tunnel:
        profiles: ['demo']
        image: 'cloudflare/cloudflared:latest'
        command: ['tunnel', '--no-autoupdate', '--url', 'http://demo-proxy:8000']
        networks:
            - demo
        depends_on:
            - demo-proxy
        restart: unless-stopped
        mem_limit: 128m

    # ---- profile: obs (Prometheus + Loki + Grafana) ----
    prometheus:
        profiles: ['obs']
        image: 'prom/prometheus:latest'
        ports:
            - '${FORWARD_PROMETHEUS_PORT:-9090}:9090'
        volumes:
            - './docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
            - 'sail-prometheus:/prometheus'
        networks:
            - sail
        mem_limit: 512m
    loki:
        profiles: ['obs']
        image: 'grafana/loki:latest'
        command: ['-config.file=/etc/loki/loki-config.yml']
        ports:
            - '${FORWARD_LOKI_PORT:-3100}:3100'
        volumes:
            - './docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro'
            - 'sail-loki:/loki'
        networks:
            - sail
        mem_limit: 512m
    grafana:
        profiles: ['obs']
        image: 'grafana/grafana:latest'
        ports:
            - '${FORWARD_GRAFANA_PORT:-3000}:3000'
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_PASSWORD:-admin}'
        volumes:
            - './docker/grafana/provisioning:/etc/grafana/provisioning:ro'
            - 'sail-grafana:/var/lib/grafana'
        networks:
            - sail
        depends_on:
            - prometheus
            - loki
        mem_limit: 512m
networks:
    sail:
        driver: bridge
    # Окрема мережа з фіксованою підмережею лише заради статичної IP Caddy (довірений проксі).
    # У `sail` IPAM не задано, а змінювати його = перестворювати мережу всім, хто вже має Sail.
    demo:
        driver: bridge
        ipam:
            config:
                - subnet: '172.29.212.0/28'
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    sail-rabbitmq:
        driver: local
    sail-ollama:
        driver: local
    sail-prometheus:
        driver: local
    sail-loki:
        driver: local
    sail-grafana:
        driver: local
