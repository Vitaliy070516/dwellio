stages: [lint, analyse, test]

default:
  image: php:8.4-cli
  cache:
    key:
      files: [composer.lock]
    paths: [vendor/]
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip libpq-dev libicu-dev >/dev/null
    # sockets потрібен php-amqplib (драйвер RabbitMQ); у php:8.4-cli його немає, а в GitHub-раннері є.
    - docker-php-ext-install pdo_pgsql intl sockets >/dev/null
    # У php:8.4-cli немає php.ini → memory_limit 128M, і arch-тести Pest (php-parser по всьому app/) падають
    # з "Allowed memory size exhausted". Той самий ліміт, що й у GitHub Actions: паритет середовищ.
    - echo "memory_limit=512M" > /usr/local/etc/php/conf.d/zz-ci.ini
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist --no-progress
    - cp .env.example .env && php artisan key:generate

# Postgres + pgvector для job-ів, яким потрібна БД (openapi, pest). Прихований job — шаблон для `extends`.
.pgsql:
  services:
    - name: pgvector/pgvector:pg17
      alias: pgsql
  variables:
    POSTGRES_DB: testing
    POSTGRES_USER: sail
    POSTGRES_PASSWORD: password
    DB_CONNECTION: pgsql
    DB_HOST: pgsql
    DB_DATABASE: testing
    DB_USERNAME: sail
    DB_PASSWORD: password

# Без AWS-акаунта: -backend=false, жодних облікових даних у CI. Свій образ і без PHP-кешу.
terraform:
  stage: lint
  image:
    name: hashicorp/terraform:1.13
    entrypoint: ['']
  cache: []
  before_script: []
  script:
    - terraform fmt -check -recursive -diff terraform
    - cd terraform/envs/prod
    - terraform init -backend=false -input=false
    - terraform validate

pint:
  stage: lint
  script: vendor/bin/pint --test

phpstan:
  stage: analyse
  script: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

# Закомічена специфікація = згенерована з коду (те саме, що в GitHub Actions).
# Scramble бере типи атрибутів моделей зі схеми БД, тому потрібні Postgres і міграції.
openapi:
  stage: analyse
  extends: .pgsql
  script:
    - php artisan migrate --force --no-interaction
    - php artisan scramble:export
    - git diff --exit-code -- docs/openapi.json || { echo "docs/openapi.json is stale - run 'make openapi' and commit"; exit 1; }

pest:
  stage: test
  extends: .pgsql
  script: vendor/bin/pest
